name: CI

# Runs on GitHub Actions.
on:
  push:
  pull_request:

# Least privilege: this workflow only reads the repo to lint and test it.
permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v6
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - name: Install Homebrew Bundler RubyGems
        run: brew install-bundler-gems

      - name: Run brew test-bot --only-cleanup-before
        run: brew test-bot --only-cleanup-before

      - name: Run brew test-bot --only-setup
        run: brew test-bot --only-setup

      - name: Run brew test-bot --only-tap-syntax
        run: brew test-bot --only-tap-syntax

      - name: Run brew test-bot --only-formulae
        if: github.event_name == 'pull_request'
        run: brew test-bot --only-formulae

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'

  # Single stable gate that branch protection requires - not the concrete
  # test (os) matrix names, so the matrix can change without breaking the
  # required check on main. (No fork-guard here: unlike ssh-deploy, this repo's
  # pull_request run does more than its push run - only PRs run --only-formulae
  # and upload bottles - so same-repo PRs are not redundant and must still build.)
  ci-success:
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify the test job succeeded
        run: |
          result="${{ needs.test.result }}"
          if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
            echo "::error::test job did not succeed (result: $result)"
            exit 1
          fi
